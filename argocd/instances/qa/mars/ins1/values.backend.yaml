image:
  tag: "1.0-f36cb4e"
instance: mars
configMap:
  name: config
  values:
    OAUTH_GOOGLE_CALLBACK_URL: http://auth.qa.grubzo.food/auth/v1/oauth/login/google/callback
    OAUTH_GITHUB_CALLBACK_URL: http://auth.qa.grubzo.food/auth/v1/oauth/login/github/callback
    # Runtime
    INSTANCE: mars
    ENV: qa
httpRoute:
  name: backend-http-redirect
  hostnames:
    - "auth.qa.grubzo.food"
    - "ins1.qa.grubzo.food"
    - "mars.qa.grubzo.food"
httpsRoute:
  name: backend-https
  hostnames:
    - "auth.qa.grubzo.food"
    - "ins1.qa.grubzo.food"
    - "mars.qa.grubzo.food"
replicas: 2
resources:
  limits:
    cpu: 250m
    memory: 256Mi
