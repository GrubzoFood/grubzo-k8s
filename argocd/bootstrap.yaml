apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/GrubzoFood/grubzo-k8s.git
      targetRevision: release/1.0
      path: argocd/common
    - repoURL: https://github.com/GrubzoFood/grubzo-k8s.git
      targetRevision: release/1.0
      path: argocd/instances
    - repoURL: https://github.com/GrubzoFood/grubzo-k8s.git
      targetRevision: release/1.0
      path: argocd/operations
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
