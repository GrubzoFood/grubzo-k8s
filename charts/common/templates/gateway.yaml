apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: default
  namespace: gateway
spec:
  gatewayClassName: envoy
  listeners:
    - protocol: HTTP
      port: 80
      name: http-gateway
      allowedRoutes:
        namespaces:
          from: All

    - protocol: HTTP
      port: 443
      name: https-gateway
      allowedRoutes:
        namespaces:
          from: All
