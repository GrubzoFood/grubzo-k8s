apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.appName }}
  name: {{ .Values.service.name }}
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
      name: "80"
    - port: 443
      protocol: TCP
      targetPort: 80      
      name: "443"
  selector:
    app: {{ .Values.appName }}
  type: {{ .Values.service.type }}
status:
  loadBalancer: {}